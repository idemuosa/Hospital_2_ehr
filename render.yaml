services:
  # Backend API (Django)
  - type: web
    name: hospital-backend
    env: python
    buildCommand: |
      cd backend_api
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: |
      cd backend_api
      gunicorn hospital_project.asgi:application -k uvicorn.workers.UvicornWorker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hospital-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: hospital-backend.onrender.com

  # Celery Worker
  - type: worker
    name: hospital-worker
    env: python
    buildCommand: |
      cd backend_api
      pip install -r requirements.txt
    startCommand: |
      cd backend_api
      celery -A hospital_project worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hospital-redis
          property: connectionString

  # Frontend (React)
  - type: web
    name: hospital-frontend
    env: static
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: VITE_API_URL
        value: https://hospital-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Database
databases:
  - name: hospital-db
    plan: free

# Redis
redis:
  - name: hospital-redis
    plan: free
    ipAllowList: [] # Only allow internal connections
